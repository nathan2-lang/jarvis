name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -qo '*.zip'
      - name: Telecharger le modele du mot de reveil
        run: |
          curl -L -o /tmp/model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q /tmp/model.zip -d /tmp/model
          mkdir -p jarvis/app/src/main/assets
          mv /tmp/model/vosk-model-small-en-us-0.15 jarvis/app/src/main/assets/model-en
          date +%s > jarvis/app/src/main/assets/model-en/uuid
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug
        working-directory: jarvis
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
